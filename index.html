<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--BODY-START-->
<title>北海道 여행 수첩</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9FD3EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Yomogi&display=swap">
<style>
:root{
  /* 여름 한낮의 비에이 — 하늘, 풀밭, 햇살 */
  --sky-top:#8FCBE8; --sky-mid:#C7E7F2; --sky-low:#FBF3DC;
  --cloud:#FFFFFF; --cloud-shade:#E3EEF4;
  --hill-far:#A9CF9A; --hill-mid:#7FB36A; --hill-near:#5C9650; --field-a:#E8D27A; --field-b:#C9DE8E; --field-c:#9CC47F;
  --roof:#D9604A; --wall:#FFF7E6; --trunk:#8A6A4A; --sun:#FFD66B; --sun-glow:rgba(255,214,107,.45); --star-op:0;
  --paper:#FBF6E9; --paper-2:#F3EAD3; --card:#FFFDF6;
  --ink:#3E3A33; --ink-soft:#6E675B; --ink-faint:#9C9384;
  --grass:#5C9650; --grass-soft:rgba(92,150,80,.13);
  --skyc:#3F82AE; --skyc-soft:rgba(63,130,174,.12);
  --tomato:#D9604A; --tomato-soft:rgba(217,96,74,.12);
  --amber:#C98A1E; --amber-soft:rgba(201,138,30,.14);
  --pink:#C7668A; --pink-soft:rgba(199,102,138,.12);
  --lav:#7B6FB0; --lav-soft:rgba(123,111,176,.13);
  --line:rgba(110,92,60,.2);
  --shadow:0 2px 0 rgba(110,92,60,.08),0 10px 24px -14px rgba(110,92,60,.45);
  --hand:"Gaegu","Yomogi","Nanum Pen Script","Comic Sans MS",cursive;
  --jp:"Yomogi","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:20px 16px 22px 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky-top:#16223F; --sky-mid:#27395F; --sky-low:#46557A;
    --cloud:#56658A; --cloud-shade:#44527A;
    --hill-far:#2F4A4C; --hill-mid:#27403F; --hill-near:#1D3331; --field-a:#4A5A3E; --field-b:#34503E; --field-c:#2B4638;
    --roof:#A9503F; --wall:#F4E3B5; --trunk:#3B3026; --sun:#FFF1C2; --sun-glow:rgba(255,241,194,.25); --star-op:.9;
    --paper:#1A2132; --paper-2:#222B40; --card:#232C42;
    --ink:#F1EAD8; --ink-soft:#B9B3A4; --ink-faint:#878374;
    --grass:#95C77F; --grass-soft:rgba(149,199,127,.14);
    --skyc:#8CC3E6; --skyc-soft:rgba(140,195,230,.13);
    --tomato:#F08C70; --tomato-soft:rgba(240,140,112,.15);
    --amber:#EDBB5C; --amber-soft:rgba(237,187,92,.15);
    --pink:#E79AB8; --pink-soft:rgba(231,154,184,.14);
    --lav:#B3A8E6; --lav-soft:rgba(179,168,230,.15);
    --line:rgba(241,234,216,.16);
    --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky-top:#16223F; --sky-mid:#27395F; --sky-low:#46557A;
  --cloud:#56658A; --cloud-shade:#44527A;
  --hill-far:#2F4A4C; --hill-mid:#27403F; --hill-near:#1D3331; --field-a:#4A5A3E; --field-b:#34503E; --field-c:#2B4638;
  --roof:#A9503F; --wall:#F4E3B5; --trunk:#3B3026; --sun:#FFF1C2; --sun-glow:rgba(255,241,194,.25); --star-op:.9;
  --paper:#1A2132; --paper-2:#222B40; --card:#232C42;
  --ink:#F1EAD8; --ink-soft:#B9B3A4; --ink-faint:#878374;
  --grass:#95C77F; --grass-soft:rgba(149,199,127,.14);
  --skyc:#8CC3E6; --skyc-soft:rgba(140,195,230,.13);
  --tomato:#F08C70; --tomato-soft:rgba(240,140,112,.15);
  --amber:#EDBB5C; --amber-soft:rgba(237,187,92,.15);
  --pink:#E79AB8; --pink-soft:rgba(231,154,184,.14);
  --lav:#B3A8E6; --lav-soft:rgba(179,168,230,.15);
  --line:rgba(241,234,216,.16);
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(60% 40% at 110% 30%, var(--grass-soft), transparent 70%),
    radial-gradient(50% 30% at -10% 70%, var(--skyc-soft), transparent 70%),
    var(--paper);
  background-attachment:fixed;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px dashed var(--tomato);outline-offset:3px}
a{color:var(--skyc)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}

/* ---------- 풍경 헤더 ---------- */
.hero{position:relative;overflow:hidden;min-height:300px;display:flex}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.cloud-drift{animation:drift 60s linear infinite alternate}
.cloud-drift.slow{animation-duration:90s}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}
@media (prefers-reduced-motion:reduce){.cloud-drift{animation:none}}
.hero-in{position:relative;z-index:1;width:100%;padding-block:26px 150px;display:grid;gap:6px;align-content:start}
.eyebrow{font-family:var(--jp);font-size:14px;letter-spacing:.25em;color:#2F5F7E}
.hero h1{margin:0;font-family:var(--hand);font-weight:700;font-size:40px;line-height:1.05;color:#23405A;text-wrap:balance;
  text-shadow:0 2px 0 rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.8)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px}
.hero-meta span{font-size:13px;background:rgba(255,253,246,.82);color:#4A5360;padding:3px 12px;border-radius:999px;backdrop-filter:blur(3px)}
.hero-meta .dday{font-family:var(--hand);font-weight:700;font-size:17px;color:#fff;background:var(--tomato)}
.hero-meta .dday:empty{display:none}
:root[data-theme="dark"] .eyebrow,:root[data-theme="dark"] .hero h1{color:#F6EFD9;text-shadow:0 2px 10px rgba(0,0,0,.5)}
:root[data-theme="dark"] .hero-meta span:not(.dday){background:rgba(35,44,66,.8);color:#E5DECB}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .eyebrow,:root:not([data-theme="light"]) .hero h1{color:#F6EFD9;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .hero-meta span:not(.dday){background:rgba(35,44,66,.8);color:#E5DECB}
}

/* ---------- 하단 탭 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:520px;margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 10px 30px -10px rgba(60,50,30,.45)}
.tab{background:none;border:0;border-radius:20px;padding:5px 4px 4px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:0;transition:background .2s,color .2s}
.tab .k{font-family:var(--jp);font-size:20px;line-height:1.2}
.tab .l{font-family:var(--hand);font-size:15px;font-weight:700;line-height:1.1}
.tab[aria-selected="true"]{background:var(--grass);color:#fff}

/* ---------- 일차 선택 ---------- */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-34px;position:relative;z-index:2}
.day-btn{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);box-shadow:var(--shadow);transition:transform .2s}
.day-btn:hover{transform:translateY(-2px)}
.hanko{width:38px;height:38px;display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:24px;border-radius:50%;color:#fff;background:var(--ink-faint);line-height:1}
.day-btn:nth-child(1) .hanko{background:var(--skyc)}
.day-btn:nth-child(2) .hanko{background:#3E9AA8}
.day-btn:nth-child(3) .hanko{background:var(--pink)}
.day-btn:nth-child(4) .hanko{background:var(--amber)}
.day-btn .d{font-family:var(--hand);font-size:15px;font-weight:700;line-height:1.2;text-align:center}
.day-btn[aria-pressed="true"]{border-color:var(--grass);background:var(--grass-soft);color:var(--ink);transform:translateY(-3px)}
.day-head{padding-block:18px 4px}
.day-head h2{margin:0;font-family:var(--hand);font-weight:700;font-size:30px;line-height:1.15;text-wrap:balance}
.day-head .jp{font-family:var(--jp);color:var(--grass);font-size:14px;letter-spacing:.15em}
.day-head p{margin:8px 0 0;color:var(--ink-soft);font-size:14.5px}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:700}
.chip.shu{color:var(--tomato);background:var(--tomato-soft)}

/* ---------- 타임라인: 들판 오솔길 ---------- */
.tl{list-style:none;margin:18px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:66px;top:10px;bottom:10px;width:3px;border-radius:3px;background:repeating-linear-gradient(var(--grass) 0 8px,transparent 8px 16px);opacity:.45}
.st{display:grid;grid-template-columns:44px 40px 1fr;gap:0 8px;padding-bottom:16px;position:relative}
.st-time{font-family:var(--hand);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink-soft);text-align:right;padding-top:9px}
.st-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-size:17px;background:var(--card);color:var(--grass);margin-top:0;position:relative;z-index:1;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--grass-soft)}
.st-ic.t-move,.st-ic.t-fly{color:var(--skyc);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--skyc-soft)}
.st-ic.t-food{color:var(--tomato);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--tomato-soft)}
.st-ic.t-beer{color:var(--amber);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--amber-soft)}
.st-ic.t-shop{color:var(--pink);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--pink-soft)}
.st-ic.t-stay{color:var(--lav);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--lav-soft)}
.st.done .st-ic{background:currentColor}
.st.done .st-ic::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--card);font-family:var(--sans);font-weight:700;font-size:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.st.move .card{background:var(--skyc-soft);box-shadow:none;border:1.5px dashed var(--skyc-soft)}
.card-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0;font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.card .ja{font-family:var(--jp);font-size:12.5px;color:var(--ink-faint)}
.tag{flex:none;font-family:var(--hand);font-weight:700;font-size:14px;padding:0 9px;background:var(--sun);color:#5A4210;border-radius:999px;white-space:nowrap;transform:rotate(3deg);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta span b{color:var(--ink);font-weight:700}
.desc{margin:8px 0 0;font-size:14.5px}
.tips{margin:10px 0 0;padding:9px 12px;border-radius:14px 10px 14px 8px;background:var(--grass-soft);font-size:13.5px;color:var(--ink-soft)}
.tips b{color:var(--grass)}
details.how{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:8px}
details.how summary{list-style:none;cursor:pointer;font-family:var(--hand);font-weight:700;font-size:17px;color:var(--skyc);display:flex;align-items:center;gap:6px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details.how[open] summary::before{transform:rotate(90deg)}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:7px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--skyc);color:var(--card);font-family:var(--hand);font-weight:700;font-size:15px;display:grid;place-items:center;margin-top:1px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;font-size:13px;color:var(--ink);text-decoration:none;line-height:1.5}
.btn:hover{border-color:var(--grass);color:var(--grass)}
.btn.primary{background:var(--grass);border-color:var(--grass);color:#fff}
.btn.shu{background:var(--tomato);border-color:var(--tomato);color:#fff}
.btn.done-on{background:var(--grass);border-color:var(--grass);color:#fff}
.btn .n{font-variant-numeric:tabular-nums;opacity:.8}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding:4px 2px}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:4px;flex:none;cursor:pointer;background:#fff;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.thumbs img:nth-child(odd){transform:rotate(-2deg)} .thumbs img:nth-child(even){transform:rotate(2deg)}

/* ---------- 섹션 ---------- */
.sec-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:26px 0 10px}
.sec-title h2{margin:0;font-family:var(--hand);font-weight:700;font-size:30px;line-height:1.1}
.sec-title .jp{font-family:var(--jp);color:var(--grass);font-size:14px;letter-spacing:.15em}
.lead{color:var(--ink-soft);font-size:14.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.food{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.food .kan{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-size:21px;color:var(--tomato);background:var(--tomato-soft)}
.food.ate .kan{background:var(--tomato);color:#fff}
.check{display:inline-flex;align-items:center;gap:6px;font-family:var(--hand);font-weight:700;font-size:16px;color:var(--ink-soft);margin-top:6px;cursor:pointer}
.check input{accent-color:var(--grass);width:17px;height:17px}

/* ---------- 추억 앨범 ---------- */
.upl{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.upl-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.upl-row{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--ink-soft)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 11px;font-size:14px;min-width:0}
.drop{border:2px dashed var(--grass);border-radius:18px 14px 20px 12px;padding:20px 12px;text-align:center;color:var(--grass);cursor:pointer;background:var(--grass-soft);display:grid;gap:2px}
.drop b{font-family:var(--hand);font-size:22px}
.drop small{color:var(--ink-soft)}
.drop.over{background:var(--sun);color:#5A4210;border-color:var(--amber)}
.mode{font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--grass)} .dot.warn{background:var(--amber)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.fbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 13px;font-family:var(--hand);font-weight:700;font-size:16px}
.fbtn[aria-pressed="true"]{background:var(--grass);color:#fff;border-color:var(--grass)}
.album-day{margin-top:22px}
.album-day h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-family:var(--hand);font-weight:700;font-size:22px}
.album-day h3 .hanko{width:32px;height:32px;font-size:19px;background:var(--grass)}
.album-day h3 small{font-family:var(--sans);font-size:12px;color:var(--ink-soft);font-weight:400}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:16px 12px}
.ph{position:relative;padding:5px 5px 22px;border:0;background:#FFFDF8;border-radius:3px;max-width:100%;box-shadow:0 3px 10px -2px rgba(0,0,0,.25);transition:transform .2s}
.ph:nth-child(3n+1){transform:rotate(-2deg)} .ph:nth-child(3n+2){transform:rotate(1.5deg)} .ph:nth-child(3n){transform:rotate(-.5deg)}
.ph:hover{transform:rotate(0) scale(1.03)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:1px}
.ph span{position:absolute;left:6px;right:6px;bottom:2px;font-family:var(--hand);font-weight:700;font-size:13px;color:#4A443A;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--ink-soft);margin-top:16px;background:var(--card)}
.empty .jp{font-family:var(--hand);font-weight:700;font-size:26px;color:var(--grass);display:block;margin-bottom:4px}
.progress{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grass);width:0;transition:width .2s}
.msg{font-size:13px;color:var(--grass)}

/* 라이트박스 */
.lb{position:fixed;inset:0;z-index:40;background:rgba(20,26,38,.93);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lb-top{display:flex;justify-content:space-between;align-items:center;color:#eee;font-size:13px;gap:10px}
.lb-img{flex:1;min-height:0;display:grid;place-items:center;padding-block:10px}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#fff;padding:6px}
.lb-bot{display:grid;gap:8px;max-width:680px;width:100%;margin:0 auto}
.lb .inp{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.lb .btn{color:#fff;border-color:rgba(255,255,255,.3);background:transparent}
.lb .btn.shu{background:var(--tomato)}
.lb-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.x{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:4px 14px}

/* 정보 */
.info{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.info+.info{margin-top:10px}
.info h3{font-family:var(--hand)!important;font-size:24px!important}
.kv{display:grid;grid-template-columns:90px 1fr;gap:7px 12px;font-size:14px;margin:10px 0 0}
.kv dt{color:var(--ink-soft);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.jp-txt{font-family:var(--jp)}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1.5px dashed var(--line);align-items:center}
.phrase:last-child{border-bottom:0}
.phrase .j{font-family:var(--jp);font-size:17px}
.phrase .r{font-size:12.5px;color:var(--ink-soft)}
.phrase .btn{grid-row:span 2}
.calc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.calc .eq{padding-bottom:9px;color:var(--ink-soft)}

let photos = [];          // {id, day, spot, caption, takenAt, createdAt, url}
let photoMode = "local";  // "cloud" | "cloud-read" | "local" | "none"
let idb = null;

function openIDB(){
  return new Promise((res, rej) => {
    try{
      const r = indexedDB.open("hokkaido-memories", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", {keyPath:"id"});
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
}
function idbAll(){
  return new Promise((res, rej) => {
    const tx = idb.transaction("photos", "readonly"); const q = tx.objectStore("photos").getAll();
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbPut(rec){
  return new Promise((res, rej) => {
    const tx = idb.transaction("photos", "readwrite"); tx.objectStore("photos").put(rec);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
function idbDel(id){
  return new Promise((res, rej) => {
    const tx = idb.transaction("photos", "readwrite"); tx.objectStore("photos").delete(id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
const localUrls = new Map();
async function loadLocalPhotos(){
  const rows = await idbAll();
  photos = rows.map(r => {
    if(!localUrls.has(r.id)) localUrls.set(r.id, URL.createObjectURL(r.blob));
    return {...r, blob:undefined, url:localUrls.get(r.id)};
  }).sort((a,b) => (a.takenAt||a.createdAt) - (b.takenAt||b.createdAt));
}

async function compress(file){
  const MAX = 2048;
  try{
    let src;
    if(window.createImageBitmap){
      try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){ src = null; }
    }
    if(!src){
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    }
    const w = src.width, h = src.height, s = Math.min(1, MAX / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w*s); c.height = Math.round(h*s);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    if(blob) return blob;
  }catch(e){}
  return file;
}

async function addPhotos(files, day, spot, caption, onProgress){
  let ok = 0, fail = 0;
  for(let i=0;i<files.length;i++){
    const f = files[i];
    try{
      const blob = await compress(f);
      const rec = {day:Number(day)||0, spot:spot||"", caption:caption||"", takenAt:f.lastModified||Date.now(), createdAt:Date.now()};
      if(photoMode === "cloud"){
        const up = await cloud.assets.upload(blob, {type: blob.type && blob.type.startsWith("image/") ? blob.type : "image/jpeg"});
        await cloud.db.collection("photos").doc(uid()).set({...rec, asset:up.id});
      }else if(photoMode === "local"){
        const id = uid();
        await idbPut({...rec, id, blob});
      }else throw new Error("no storage");
      ok++;
    }catch(e){ fail++; console.warn(e); }
    onProgress && onProgress(i+1, files.length);
  }
  if(photoMode === "local") await loadLocalPhotos();
  return {ok, fail};
}
async function updatePhoto(id, patch){
  if(photoMode === "cloud"){ await cloud.db.doc("photos/"+id).update(patch); return; }
  if(photoMode === "local"){
    const tx = idb.transaction("photos", "readwrite"); const st = tx.objectStore("photos");
    await new Promise((res, rej) => { const g = st.get(id); g.onsuccess = () => { st.put({...g.result, ...patch}); }; tx.oncomplete = res; tx.onerror = rej; });
    await loadLocalPhotos();
  }
}
async function deletePhoto(p){
  if(photoMode === "cloud"){
    await cloud.db.doc("photos/"+p.id).delete();
    try{ await cloud.assets.delete(p.asset); }catch(e){}
    return;
  }
  if(photoMode === "local"){
    await idbDel(p.id);
    if(localUrls.has(p.id)){ URL.revokeObjectURL(localUrls.get(p.id)); localUrls.delete(p.id); }
    await loadLocalPhotos();
  }
}

function calc(){
  const y = parseFloat(($("#c-yen")?.value||"").replace(/,/g,"")) || 0;
  const r = parseFloat($("#c-rate")?.value) || 0;
  const w = $("#c-won"); if(w) w.value = Math.round(y*r).toLocaleString("ko-KR") + "원";
}

/* =========================================================
   공통
   ========================================================= */
function renderHero(){
  const hd = $("#heroDates"), dd = $("#dday");
  if(state.start){
    hd.textContent = dayDate(1) + " – " + dayDate(4);
    const s = new Date(state.start + "T00:00:00"); const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((s - today) / 86400000);
    dd.textContent = diff > 0 ? "D-" + diff : (diff > -4 ? (1 - diff) + "일차 여행 중" : "다녀온 여행");
  }else{ hd.textContent = "여행 날짜는 '정보' 탭에서 입력하세요"; dd.textContent = ""; }
}
function renderAll(){
  renderHero();
  if(view === "plan") renderPlan();
  if(view === "food") renderFood();
  if(view === "mem") renderMem();
  if(view === "info") renderInfo();
}
function show(v){
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  ["plan","food","mem","info"].forEach(k => $("#v-"+k).hidden = k !== v);
  renderAll();
  window.scrollTo({top:0});
}

async function saveBlobToDevice(url, name){
  try{
    const blob = await (await fetch(url)).blob();
    if(cloud.downloads){ await cloud.downloads.save({filename:name, data:blob}); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ window.open(url, "_blank"); }
}
async function copy(txt, btn){
  try{ await navigator.clipboard.writeText(txt); const o = btn.textContent; btn.textContent = "복사됨"; setTimeout(() => btn.textContent = o, 1200); }
  catch(e){ const r = document.createRange(); const el = btn.previousElementSibling || btn.parentElement; r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}

async function doUpload(files, day, spot, cap, progEl, msgEl){
  if(!files.length) return;
  if(progEl){ progEl.hidden = false; progEl.firstElementChild.style.width = "0"; }
  if(msgEl) msgEl.textContent = files.length + "장 저장 중…";
  const r = await addPhotos(files, day, spot, cap, (i,n) => { if(progEl) progEl.firstElementChild.style.width = (i/n*100) + "%"; });
  const text = r.fail ? `${r.ok}장 저장, ${r.fail}장 실패. 실패한 사진은 JPG/PNG로 다시 올려보세요.` : `${r.ok}장 저장했어요.`;
  renderAll();
  const m = $("#upMsg"); if(m) m.textContent = text;
  return r;
}

/* 이벤트 */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, img[data-open]"); if(!t) return;
  if(t.classList.contains("tab")) return show(t.dataset.v);
  if(t.dataset.day){ curDay = Number(t.dataset.day); lsSet("hk-day", curDay); return renderPlan(); }
  if(t.dataset.done){ state.done[t.dataset.done] = !state.done[t.dataset.done]; saveState(); return renderPlan(); }
  if(t.dataset.open){ return openLB(t.dataset.open); }
  if(t.dataset.mf){ memFilter = t.dataset.mf; return renderMem(); }
  if(t.dataset.copy){ return copy(t.dataset.copy, t); }
  if(t.dataset.quick){ quickSpot = t.dataset.quick; $("#quickFile").value = ""; return $("#quickFile").click(); }
  if(t.dataset.lb){
    const p = photos.find(x => x.id === lbId); const act = t.dataset.lb;
    if(act === "close"){ $("#lb").hidden = true; lbId = null; return; }
    if(!p) return;
    const idx = photos.indexOf(p);
    if(act === "prev" && idx > 0){ lbId = photos[idx-1].id; lbDelArm = false; return renderLB(); }
    if(act === "next" && idx < photos.length-1){ lbId = photos[idx+1].id; lbDelArm = false; return renderLB(); }
    if(act === "save"){ const v = $("#lbCap").value.trim(); try{ await updatePhoto(p.id, {caption:v}); t.textContent = "저장됨"; }catch(err){ t.textContent = "저장 실패"; } renderAll(); return; }
    if(act === "dl"){ return saveBlobToDevice(p.url, `hokkaido-day${p.day}-${p.id}.jpg`); }
    if(act === "del"){
      if(!lbDelArm){ lbDelArm = true; return renderLB(); }
      const next = photos[idx+1] || photos[idx-1];
      try{ await deletePhoto(p); }catch(err){}
      lbId = next ? next.id : null; lbDelArm = false;
      renderAll(); return lbId ? renderLB() : ($("#lb").hidden = true);
    }
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#lb").hidden){ $("#lb").hidden = true; lbId = null; } });

let quickSpot = "";
$("#quickFile").addEventListener("change", async e => {
  const files = [...e.target.files]; const it = itemById(quickSpot);
  if(!files.length || !it) return;
  const btn = document.querySelector(`[data-quick="${quickSpot}"]`); if(btn) btn.textContent = "저장 중…";
  await doUpload(files, it.day, it.id, "");
});

document.addEventListener("change", async e => {
  const t = e.target;
  if(t.dataset.ate){ state.ate[t.dataset.ate] = t.checked; saveState(); return renderFood(); }
  if(t.id === "upDay"){ $("#upSpot").innerHTML = spotOptions(t.value); return; }
  if(t.id === "upFile"){
    const files = [...t.files];
    await doUpload(files, $("#upDay").value, $("#upSpot").value, $("#upCap").value.trim(), $("#upProg"), $("#upMsg"));
    return;
  }
  if(t.id === "i-start"){ state.start = t.value; saveState(); renderHero(); return; }
});
document.addEventListener("input", e => {
  const t = e.target;
  const map = {"i-checkin":"checkin","i-checkout":"checkout","i-resv":"resv","i-memo":"memo","c-rate":"rate"};
  if(map[t.id]){ state[map[t.id]] = t.value; saveState(); }
  if(t.id === "c-yen" || t.id === "c-rate") calc();
});
document.addEventListener("submit", e => e.preventDefault());
["dragover","dragenter"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", async e => {
  const d = e.target.closest && e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
  await doUpload(files, $("#upDay").value, $("#upSpot").value, $("#upCap").value.trim(), $("#upProg"), $("#upMsg"));
});

/* =========================================================
   시작
   ========================================================= */
async function initLocal(){
  try{ idb = await openIDB(); photoMode = "local"; await loadLocalPhotos(); }
  catch(e){ photoMode = "none"; }
}
async function initCloud(){
  const c = window.claude;
  if(!c || typeof c.use !== "function") return false;
  let db = null, assets = null, downloads = null;
  try{ [db, assets, downloads] = await Promise.all([c.use("db"), c.use("assets"), c.use("downloads")]); }catch(e){ return false; }
  if(!db) return false;
  cloud = {db, assets, downloads};
  photoMode = assets ? "cloud" : "cloud-read";
  db.collection("photos").orderBy("takenAt", "asc").onSnapshot(snap => {
    photos = snap.docs.map(d => { const v = d.data(); return {...v, id:d.id, url:"/_blob/" + v.asset}; });
    renderAll(); if(lbId) renderLB();
  }, () => {});
  db.doc("trip/state").onSnapshot(snap => {
    if(!snap.exists) return;
    const remote = snap.data();
    if(JSON.stringify(remote) === JSON.stringify(state)) return;
    state = Object.assign({}, state, JSON.parse(JSON.stringify(remote)));
    lsSet("hk-state", state);
    const a = document.activeElement; if(a && a.classList && a.classList.contains("inp")) return;
    renderAll();
  }, () => {});
  return true;
}

(async function start(){
  if(!DAYS.some(d => d.n === curDay)) curDay = 1;
  const hash = (location.hash || "").slice(1);
  if(["plan","food","mem","info"].includes(hash)) view = hash;
  await initLocal();   // 먼저 로컬로 즉시 그림
  show(view);
  const ok = await initCloud();
  if(ok) renderAll();
})();
